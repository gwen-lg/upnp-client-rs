[package]
name = "upnp-client"
version = "0.1.11"
edition = "2021"
repository = "https://github.com/tsirysndr/upnp-client-rs"
license = "MIT"
readme = "README.md"
authors = ["Tsiry Sandratraina <tsiry.sndr@aol.com>"]
categories = ["command-line-utilities", "network-programming"]
keywords = ["upnp", "client", "tokio", "dlna"]
description = "A simple UPnP client written in Rust"
rust-version = "1.80.0" # minimum for LazyLock

[[example]]
name = "discover"
path = "examples/discover.rs"

[[example]]
name = "media-renderer-client"
path = "examples/media_renderer_client.rs"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
elementtree = "1.2"
futures-util = "0.3"
http = "0.2"
hyper = { version = "0.14", features = ["server", "runtime", "client", "stream", "tcp", "http1", "http2"] }
owo-colors = "3.5"
serde = "1.0"
serde_json = "1.0"
surf = { version = "2.3.2", features = ["h1-client-rustls"], default-features = false}
tokio = { version = "1.24.2", features = ["tokio-macros", "macros", "rt", "rt-multi-thread"] }
url = "2.3"
xml-builder = "0.5"
xml-rs = "0.8"

[dev-dependencies]
colored_json = "5.0"

[lints.rust]
#rust-2024-compatibility = "warn"
